<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.24</title>
   <script type="text/javascript">
      document.writeln("<table border='1'>");
      document.writeln("<tr><th>Número</th><th>Cuadrado</th><th>Cubo</th></tr>");

      for (var i = 0; i <= 5; i++) {
         var cuadrado = i * i;
         var cubo = i * i * i;
         document.writeln("<tr><td>" + i + "</td><td>" + cuadrado + "</td><td>" + cubo + "</td></tr>");
      }

      document.writeln("</table>");
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
