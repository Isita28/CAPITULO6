<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.23</title>
   <script type="text/javascript">
      var numeros = [];
      for (var i = 0; i < 3; i++) {
         numeros[i] = parseInt(window.prompt("Escriba el número " + (i+1)));
      }

      var positivos = 0, negativos = 0, ceros = 0;

      for (var i = 0; i < numeros.length; i++) {
         if (numeros[i] > 0) {
            positivos++;
         } else if (numeros[i] < 0) {
            negativos++;
         } else {
            ceros++;
         }
      }

      document.writeln("<h1>Positivos: " + positivos + "</h1>");
      document.writeln("<h1>Negativos: " + negativos + "</h1>");
      document.writeln("<h1>Ceros: " + ceros + "</h1>");
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
