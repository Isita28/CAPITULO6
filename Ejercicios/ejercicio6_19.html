<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.19</title>
   <script type="text/javascript">
      var radio = parseFloat(window.prompt("Escriba el radio del círculo"));

      var diametro = 2 * radio;
      var circunferencia = 2 * Math.PI * radio;
      var area = Math.PI * radio * radio;

      document.writeln("<h1>Diámetro: " + diametro + "</h1>");
      document.writeln("<h1>Circunferencia: " + circunferencia + "</h1>");
      document.writeln("<h1>Área: " + area + "</h1>");
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
