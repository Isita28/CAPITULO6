<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.22</title>
   <script type="text/javascript">
      var num1 = parseInt(window.prompt("Escriba el primer entero"));
      var num2 = parseInt(window.prompt("Escriba el segundo entero"));

      if (num1 % num2 === 0) {
         document.writeln("<h1>" + num1 + " es múltiplo de " + num2 + "</h1>");
      } else {
         document.writeln("<h1>" + num1 + " no es múltiplo de " + num2 + "</h1>");
      }
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
