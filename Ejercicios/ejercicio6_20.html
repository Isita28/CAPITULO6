<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.20</title>
   <script type="text/javascript">
      var numeros = [];
      for (var i = 0; i < 5; i++) {
         numeros[i] = parseInt(window.prompt("Escriba el entero " + (i+1)));
      }

      var menor = Math.min(...numeros);
      var mayor = Math.max(...numeros);

      document.writeln("<h1>El menor es: " + menor + "</h1>");
      document.writeln("<h1>El mayor es: " + mayor + "</h1>");
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
