<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.18</title>
   <script type="text/javascript">
      var n1 = parseInt(window.prompt("Escriba el primer entero"));
      var n2 = parseInt(window.prompt("Escriba el segundo entero"));
      var n3 = parseInt(window.prompt("Escriba el tercer entero"));

      var suma = n1 + n2 + n3;
      var promedio = suma / 3;
      var producto = n1 * n2 * n3;
      var menor = Math.min(n1, n2, n3);
      var mayor = Math.max(n1, n2, n3);

      window.alert(
         "Suma: " + suma +
         "\nPromedio: " + promedio +
         "\nProducto: " + producto +
         "\nMenor: " + menor +
         "\nMayor: " + mayor
      );
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
