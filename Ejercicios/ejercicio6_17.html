   <meta charset="utf-8">
   <title>Ejercicio 6.17</title>
   <script type="text/javascript">
      var num1 = parseInt(window.prompt("Escriba el primer entero"));
      var num2 = parseInt(window.prompt("Escriba el segundo entero"));

      if (num1 > num2) {
         window.alert(num1 + " es mayor que " + num2);
      } else if (num2 > num1) {
         window.alert(num2 + " es mayor que " + num1);
      } else {
         document.writeln("<h1>Estos números son iguales</h1>");
      }
   </script>
</head>
