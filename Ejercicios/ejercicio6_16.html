<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 6.16</title>
   <script type="text/javascript">
      var num1 = parseInt(window.prompt("Escriba el primer número"));
      var num2 = parseInt(window.prompt("Escriba el segundo número"));

      var suma = num1 + num2;
      var producto = num1 * num2;
      var diferencia = num1 - num2;
      var cociente = num1 / num2;

      document.writeln("<h1>Suma: " + suma + "</h1>");
      document.writeln("<h1>Producto: " + producto + "</h1>");
      document.writeln("<h1>Diferencia: " + diferencia + "</h1>");
      document.writeln("<h1>Cociente: " + cociente + "</h1>");
   </script>
</head>
<body>
   <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

</body>
</html>
