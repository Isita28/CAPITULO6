<!DOCTYPE html>
<!-- Fig. 6.5: bienvenido4.html -->
<!-- Cuadro indicador utilizado en una pantalla de bienvenida -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Uso de cuadros prompt y alert</title>
      <script type="text/javascript">
         var nombre; // cadena introducida por el usuario

         // lee el nombre del cuadro prompt como una cadena
         nombre = window.prompt("Escriba su nombre");

         document.writeln(
            "<h1>Hola " + nombre +
            ", bienvenido a la programación en JavaScript</h1>"
         );
      </script>
   </head>
   <body>
      <div style="margin-top:20px; text-align:center;">
   <a href="../index.html" 
      style="padding:10px 15px; background-color:#9c27b0; color:white; 
             text-decoration:none; border-radius:6px; font-weight:bold;">
      Regresar al menú
   </a>
</div>

   </body>
</html>
